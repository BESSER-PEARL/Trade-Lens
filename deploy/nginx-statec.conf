# Per visitor: the API answers at most 20 requests a second (a page load fires a burst of chart queries), and at
# most 3 agent connections are open at once.
limit_req_zone $binary_remote_addr zone=statec_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=statec_ws:10m;

server {
    server_name statec.besser-pearl.org trade-lens.besser-pearl.org 13.51.72.176 ec2-13-51-72-176.eu-north-1.compute.amazonaws.com;
    server_tokens off;

    root /opt/statec/www;
    index index.html;
    client_max_body_size 5m;

    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/ { expires 7d; add_header Cache-Control "public"; }
    location / { try_files $uri $uri/ /index.html; }

    # Not public: the generated create/read-all/update/delete routes of the data model (they would let anyone
    # change the figures, or read 2.3 million rows in one request), the API's own docs, and the routes only the
    # local processes use (they call 127.0.0.1:8000 directly). The page needs one of them: the product lookup.
    location ~ ^/api/product/search/?$ {
        limit_except GET { deny all; }
        limit_req zone=statec_api burst=100 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
    location ~ ^/api/(observation|product|country|statistics)(/|$) { return 403; }
    location ~ ^/api/(docs|redoc|openapi\.json)$ { return 404; }
    location = /api/agents/register { return 403; }

    # the API (FastAPI), with the live page stream (/view/events, SSE): no buffering, long reads
    location /api/ {
        limit_req zone=statec_api burst=100 nodelay;
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # the agents (WebSocket): statec-agent.service on 127.0.0.1:8766
    location /ws {
        limit_conn statec_ws 3;
        proxy_pass http://127.0.0.1:8766/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/statec.besser-pearl.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/statec.besser-pearl.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}
server {
    if ($host = trade-lens.besser-pearl.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = statec.besser-pearl.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name statec.besser-pearl.org trade-lens.besser-pearl.org 13.51.72.176 ec2-13-51-72-176.eu-north-1.compute.amazonaws.com;
    return 404; # managed by Certbot




}